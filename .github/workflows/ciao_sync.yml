name: Update architecture documentation

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "docs/architecture/**"
      - ".github/workflows/architecture-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install architecture generator dependency
        run: python -m pip install "pydantic>=2.7,<3"

      - name: Generate architecture documentation
        env:
          PYTHONPATH: backend
        run: python -m app.architecture_docs --root . --output docs/architecture --exclude backend/data

      - name: Commit generated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture
          if git diff --cached --quiet; then
            echo "Architecture documentation is already up to date."
          else
            git commit -m "docs: update architecture documentation"
            git push
          fi
