name: Update architecture documentation

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "docs/architecture/**"
      - ".github/workflows/architecture-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install architecture generator dependency
        run: python -m pip install "pydantic>=2.7,<3"

      - name: Generate architecture documentation
        shell: bash
        run: |
          generator="$(find . -type f -path '*/backend/app/architecture_docs.py' -not -path '*/node_modules/*' -print -quit)"
          if [ -z "$generator" ]; then
            echo "Could not find backend/app/architecture_docs.py in the checked-out repository."
            echo "Commit the CIAO backend or place this workflow in the repository that contains it."
            exit 1
          fi

          backend_dir="${generator%/app/architecture_docs.py}"
          project_root="${backend_dir%/backend}"
          if [ "$project_root" = "$backend_dir" ]; then
            echo "Found the generator outside a backend directory: $generator"
            exit 1
          fi
          project_root="${project_root#./}"
          if [ -z "$project_root" ]; then project_root="."; fi

          cd "$project_root"
          PYTHONPATH=backend python -m app.architecture_docs \
            --root . \
            --output docs/architecture \
            --exclude backend/data

          echo "PROJECT_ROOT=$project_root" >> "$GITHUB_ENV"
          echo "DOCS_DIR=$project_root/docs/architecture" >> "$GITHUB_ENV"

      - name: Commit generated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DOCS_DIR"
          if git diff --cached --quiet; then
            echo "Architecture documentation is already up to date."
          else
            git commit -m "docs: update architecture documentation"
            git push
          fi
