<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 615" role="img" aria-labelledby="title description"><title id="title">CIAO architecture overview</title><desc id="description">4 components and 4 directed data flows for 176Anjali/DOOM-Game</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,7 L10,3.5 z" fill="#52745d"/></marker></defs><rect width="100%" height="100%" rx="22" fill="#f5f6f0"/><text x="55" y="48" fill="#20302b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Architecture overview</text><text x="55" y="78" fill="#62736b" font-family="Arial,sans-serif" font-size="14">176Anjali/DOOM-Game · arrows show data-flow direction</text><path d="M 615 205 C 657 205, 693 205, 735 205" fill="none" stroke="#52745d" stroke-width="2.6" marker-end="url(#arrow)"><title>Map initialization</title></path><rect x="619" y="179" width="112" height="20" rx="8" fill="#f5f6f0" stroke="#d4ddd4" stroke-width="1"/><text x="675" y="193" text-anchor="middle" fill="#42604b" font-family="Arial,sans-serif" font-size="9.5" font-weight="600">Map initializat…</text><path d="M 335 285 L 335 318 L 335 318 L 335 350" fill="none" stroke="#52745d" stroke-width="2.6" marker-end="url(#arrow)"><title>NPC creation</title></path><rect x="291" y="294" width="88" height="20" rx="8" fill="#f5f6f0" stroke="#d4ddd4" stroke-width="1"/><text x="335" y="308" text-anchor="middle" fill="#42604b" font-family="Arial,sans-serif" font-size="9.5" font-weight="600">NPC creation</text><path d="M 335 285 L 335 318 L 1015 318 L 1015 350" fill="none" stroke="#52745d" stroke-width="2.6" marker-end="url(#arrow)"><title>Object creation</title></path><rect x="622" y="294" width="106" height="20" rx="8" fill="#f5f6f0" stroke="#d4ddd4" stroke-width="1"/><text x="675" y="308" text-anchor="middle" fill="#42604b" font-family="Arial,sans-serif" font-size="9.5" font-weight="600">Object creation</text><path d="M 615 430 C 657 430, 693 430, 735 430" fill="none" stroke="#52745d" stroke-width="2.6" marker-end="url(#arrow)"><title>NPC registration</title></path><rect x="619" y="404" width="112" height="20" rx="8" fill="#f5f6f0" stroke="#d4ddd4" stroke-width="1"/><text x="675" y="418" text-anchor="middle" fill="#42604b" font-family="Arial,sans-serif" font-size="9.5" font-weight="600">NPC registration</text><g><title>Game class: The main class that initializes the game environment and handles events.</title><rect x="55" y="125" width="560" height="160" rx="16" fill="#ffffff" stroke="#aebfb2" stroke-width="1.8"/><text x="77" y="153" fill="#65816b" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">COMPONENT 01</text><text x="77" y="179" fill="#22332d" font-family="Arial,sans-serif" font-size="18" font-weight="700">Game class</text><text x="77" y="207" fill="#64736d" font-family="Arial,sans-serif" font-size="12">The main class that initializes the game environment and handles</text><text x="77" y="224" fill="#64736d" font-family="Arial,sans-serif" font-size="12">events.</text></g><g><title>Map class: The class that represents the game map and handles map-related logic.</title><rect x="735" y="125" width="560" height="160" rx="16" fill="#ffffff" stroke="#aebfb2" stroke-width="1.8"/><text x="757" y="153" fill="#65816b" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">COMPONENT 02</text><text x="757" y="179" fill="#22332d" font-family="Arial,sans-serif" font-size="18" font-weight="700">Map class</text><text x="757" y="207" fill="#64736d" font-family="Arial,sans-serif" font-size="12">The class that represents the game map and handles map-related</text><text x="757" y="224" fill="#64736d" font-family="Arial,sans-serif" font-size="12">logic.</text></g><g><title>NPC class: The base class for all NPCs, handling their movement and behavior.</title><rect x="55" y="350" width="560" height="160" rx="16" fill="#ffffff" stroke="#aebfb2" stroke-width="1.8"/><text x="77" y="378" fill="#65816b" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">COMPONENT 03</text><text x="77" y="404" fill="#22332d" font-family="Arial,sans-serif" font-size="18" font-weight="700">NPC class</text><text x="77" y="432" fill="#64736d" font-family="Arial,sans-serif" font-size="12">The base class for all NPCs, handling their movement and behavior.</text></g><g><title>ObjectHandler class: The class that handles all game objects, including NPCs and static objects.</title><rect x="735" y="350" width="560" height="160" rx="16" fill="#ffffff" stroke="#aebfb2" stroke-width="1.8"/><text x="757" y="378" fill="#65816b" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">COMPONENT 04</text><text x="757" y="404" fill="#22332d" font-family="Arial,sans-serif" font-size="18" font-weight="700">ObjectHandler class</text><text x="757" y="432" fill="#64736d" font-family="Arial,sans-serif" font-size="12">The class that handles all game objects, including NPCs and static</text><text x="757" y="449" fill="#64736d" font-family="Arial,sans-serif" font-size="12">objects.</text></g></svg>