name: CIAO documentation and architecture sync

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/CIAO_DOCUMENTATION.md"
      - "docs/CIAO_DOCUMENTATION.pdf"
      - "docs/CIAO_ARCHITECTURE.svg"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ciao-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    # For fast repeated runs, replace ubuntu-latest with self-hosted and install
    # Ollama plus the selected model on that runner once.
    runs-on: ubuntu-latest
    env:
      CIAO_PROVIDER: ${{ vars.CIAO_PROVIDER || 'ollama' }}
      CIAO_MODEL: ${{ vars.CIAO_MODEL || 'llama3.2:3b' }}
      OLLAMA_HOST: ${{ vars.CIAO_OLLAMA_HOST || 'http://127.0.0.1:11434' }}
      CIAO_API_BASE_URL: ${{ vars.CIAO_API_BASE_URL || 'https://api.openai.com/v1' }}
      CIAO_API_KEY: ${{ secrets.CIAO_API_KEY }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install report generator dependency
        run: python -m pip install --upgrade pip reportlab

      - name: Install Ollama on this runner
        if: ${{ env.CIAO_PROVIDER == 'ollama' && !vars.CIAO_OLLAMA_HOST }}
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama service
        if: ${{ env.CIAO_PROVIDER == 'ollama' && !vars.CIAO_OLLAMA_HOST }}
        run: |
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/ollama.log
          exit 1

      - name: Download selected Ollama model
        if: ${{ env.CIAO_PROVIDER == 'ollama' && !vars.CIAO_OLLAMA_HOST }}
        run: ollama pull "$CIAO_MODEL"

      - name: Generate documentation and architecture diagram
        run: python github_sync/ciao_github_sync.py

      - name: Commit updated deliverables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CIAO_DOCUMENTATION.md docs/CIAO_DOCUMENTATION.pdf docs/CIAO_ARCHITECTURE.svg
          if ! git diff --cached --quiet; then
            git commit -m "docs: update CIAO architecture deliverables"
            git push
          else
            echo "CIAO deliverables are already up to date."
          fi
